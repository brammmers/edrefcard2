version: '3.8'

services:
  edrefcard:
    build: .
    volumes:
      - edrefcard_data:/app/www/configs
    environment:
      - PYTHONUNBUFFERED=1
      - EDREFCARD_ADMIN_USER
      - EDREFCARD_ADMIN_PASS
      - FLASK_SECRET_KEY
      - APP_URL
      - APP_ENV
      - EDREFCARD_CONFIGS_DIR=/app/www/configs
    restart: unless-stopped
    # NO PORT MAPPING - Dokploy/Traefik handles routing automatically
    # The container listens on port 8000 internally (defined in Dockerfile)
    # Traefik routes traffic from configured domains

volumes:
  edrefcard_data:
